// companions-specific build logic. Applied last by the shared gradle/build.gradle, so it can
// reconfigure anything that file set up.

// Datagen writes per version, into its node's own versions/<v>/src/main/generated. Stonecutter also
// maps the shared tree's src/main/generated into each node, where a single-version run's leftover
// output would ship beside the node's own or clash with it, so drop that mapping.
if (project != rootProject) {
	afterEvaluate {
		def resources = sourceSets.main.resources
		def shared = [rootProject.file('src/main/generated'),
				layout.buildDirectory.dir('generated/stonecutter/main/generated').get().asFile]
		// Keep the tasks behind the remaining dirs (stonecutterGenerate), which plain Files drop.
		def builders = resources.sourceDirectories.buildDependencies.getDependencies(null)
		resources.srcDirs = [files(resources.srcDirs - shared).builtBy(builders)]
	}
}

// A check for datagen's output can't live in processResources: runDatagen needs :classes, which
// depends on processResources, so on a fresh clone processResources always runs once before
// runDatagen has produced anything. shadowJar has no such cycle, so it is where a clone missing
// that output gets caught — right before the jar that would ship without models or textures.
// file() resolves against this project, so a version node checks its own output.
tasks.named('shadowJar') {
	doFirst {
		def generated = file('src/main/generated/assets/companions')
		def missing = ['items/white_wolf_sweater.json', 'textures/item/white_wolf_sweater.png']
				.collect { new File(generated, it) }
				.findAll { !it.exists() }
		if (!missing.isEmpty()) {
			throw new GradleException(
					"Generated sweater datagen output is missing from ${generated}: " +
							"${missing*.name.join(', ')}. Run: ./gradlew generateAssets")
		}
	}
}
